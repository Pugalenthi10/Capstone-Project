# Test profile: in-memory H2 (MySQL mode). Hibernate creates the schema; Flyway (MySQL-specific SQL) is off.
spring.datasource.url=jdbc:h2:mem:estatehub_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=unit-test-secret-unit-test-secret-1234567890
app.seed.enabled=false
