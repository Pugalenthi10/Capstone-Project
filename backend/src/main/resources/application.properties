# ---------------------------------------------------------------
# Trichy Estates backend configuration.
# Every secret / environment-specific value comes from an
# environment variable. See .env.example.
# ---------------------------------------------------------------
spring.application.name=estatehub
server.port=${PORT:8080}

# ---- Database (MySQL 8+) ----
# DB_URL example: jdbc:mysql://localhost:3306/estatehub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned entirely by Flyway (src/main/resources/db/migration).
# Hibernate never creates or alters tables ("none").
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---- JWT ----
# JWT_SECRET has NO default on purpose: the app refuses to start without it.
# It must be at least 32 characters. Generate one with:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ---- CORS ----
# Comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5501,http://127.0.0.1:5501}

# ---- Public URL of the frontend (used in password-reset links) ----
app.frontend-url=${FRONTEND_PUBLIC_URL:http://localhost:5501}

# ---- Contact details shown by the frontend (demo placeholder by default) ----
# CONTACT_PHONE: international format, e.g. +919876543210
app.contact.phone=${CONTACT_PHONE:+919876543210}
app.contact.whatsapp=${CONTACT_WHATSAPP:${CONTACT_PHONE:+919876543210}}

# ---- Password reset ----
app.password-reset.expiration-minutes=${PASSWORD_RESET_MINUTES:30}
# Set MAIL_LOG_RESET_LINKS=true in LOCAL DEVELOPMENT ONLY to print reset links to the log
# when no SMTP server is configured. Never enable in production.
app.mail.log-reset-links=${MAIL_LOG_RESET_LINKS:false}
app.mail.from=${MAIL_FROM:no-reply@trichyestates.example}

# ---- SMTP (optional). Uncomment and set to send real emails. ----
# spring.mail.host=${SMTP_HOST}
# spring.mail.port=${SMTP_PORT:587}
# spring.mail.username=${SMTP_USERNAME}
# spring.mail.password=${SMTP_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Development seed data ----
# Seeds 1 ADMIN, 1 AGENT and the 30 original properties (idempotent).
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@trichyestates.local}
app.seed.admin-mobile=${SEED_ADMIN_MOBILE:9000000001}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.agent-email=${SEED_AGENT_EMAIL:agent@trichyestates.local}
app.seed.agent-mobile=${SEED_AGENT_MOBILE:9000000002}
app.seed.agent-password=${SEED_AGENT_PASSWORD:}

# ---- Misc ----
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=non_null
